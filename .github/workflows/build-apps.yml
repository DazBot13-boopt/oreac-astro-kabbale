name: Applications Android et Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Installer le SDK Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Installer les dépendances
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm install --no-audit --no-fund
      - name: Préparer l'application Android
        run: |
          npm run build:web
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/com/oreac/astrokabbale
          cp native/android/*.java android/app/src/main/java/com/oreac/astrokabbale/
          python3 scripts/patch-android-gradle.py
      - name: Compiler l'APK installable
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../OREAC-Astro-Kabbale.apk
          file ../OREAC-Astro-Kabbale.apk | grep -qi apk
      - uses: actions/upload-artifact@v4
        with:
          name: OREAC-Astro-Kabbale-Android-APK
          path: OREAC-Astro-Kabbale.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: OREAC-Astro-Kabbale.apk

  windows:
    name: Installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Compiler l'installateur
        run: npm run build:windows
      - name: Renommer l'installateur
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "OREAC-Astro-Kabbale-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: OREAC-Astro-Kabbale-Windows-Setup
          path: OREAC-Astro-Kabbale-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-exe
          path: OREAC-Astro-Kabbale-Setup.exe

  release:
    name: Release publique
    needs: [android, windows]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: release-exe
          path: out
      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: OREAC Astro Kabbale v1.1.1
          body: |
            Correctif install Android (signature v1+v2) + fusion saisie unique.

            ## Liens directs
            - Android : https://github.com/DazBot13-boopt/oreac-astro-kabbale/releases/download/v1.1.1/OREAC-Astro-Kabbale.apk
            - Windows : https://github.com/DazBot13-boopt/oreac-astro-kabbale/releases/download/v1.1.1/OREAC-Astro-Kabbale-Setup.exe

            Android : désinstaller l'ancienne OREAC, autoriser les sources inconnues, ouvrir le fichier .apk (~6-7 Mo).
          files: |
            out/OREAC-Astro-Kabbale.apk
            out/OREAC-Astro-Kabbale-Setup.exe
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
