name: Applications Android et Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Installer le SDK Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Installer les dépendances
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm install --no-audit --no-fund
      - name: Préparer l'application Android
        run: |
          npm run build:web
          npx cap add android
          npx cap sync android
          cp native/android/*.java android/app/src/main/java/com/oreac/astrokabbale/
      - name: Compiler l'APK installable
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OREAC-Astro-Kabbale-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Compiler l'installateur
        run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: OREAC-Astro-Kabbale-Windows-Setup
          path: dist/*.exe
          if-no-files-found: error
