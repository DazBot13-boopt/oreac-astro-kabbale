<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Astrologie &amp; Horoscope</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#0a1630">
  <link rel="stylesheet" href="css/wine-clone.css?v=132">
</head>
<body>
  <!-- Clone exact de l'écran Wine « Choisir Astrologie ou Horoscope » -->
  <div id="fit">
    <div id="stage" class="screen-choix">
      <img class="bg" src="res/wine_choix.png" alt="Astrologie &amp; Horoscope">

      <!-- Liste profils : hotspot transparent (le bitmap Wine affiche déjà la boîte) -->
      <select id="profileList" class="hot spot-list" size="8" aria-label="Choix d'un profil"></select>

      <button type="button" class="hot spot-add" id="btnAdd" title="Ajouter" aria-label="Ajouter"></button>
      <button type="button" class="hot spot-edit" id="btnEdit" title="Modifier" aria-label="Modifier"></button>
      <button type="button" class="hot spot-del" id="btnDel" title="Supprimer" aria-label="Supprimer"></button>

      <button type="button" class="hot spot-horo" id="btnHoro" title="HOROSCOPE" aria-label="Horoscope"></button>
      <button type="button" class="hot spot-astro" id="btnAstro" title="ASTROLOGIE" aria-label="Astrologie"></button>
      <button type="button" class="hot spot-quit" id="btnQuit" title="Quitter" aria-label="Quitter"></button>
    </div>
  </div>

  <!-- Panneau module (remplace temporairement le stage) -->
  <div id="module" class="hidden" aria-live="polite">
    <header class="mod-bar">
      <button type="button" id="btnBack">◀ Menu Wine</button>
      <strong id="modTitle">Module</strong>
      <button type="button" id="btnPrint">Imprimer</button>
    </header>
    <div id="modBody"></div>
  </div>

  <script src="js/delphi-calc.js?v=132"></script>
  <script src="js/wine-app.js?v=132"></script>
</body>
</html>
