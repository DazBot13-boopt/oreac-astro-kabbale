<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Astrologie &amp; Horoscope</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#0c1214">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .hero {
      min-height: 70vh;
      display: grid;
      align-content: center;
      gap: 18px;
      padding: 24px 8px;
      text-align: center;
    }
    .hero img.logo {
      width: 96px; height: 96px; border-radius: 22px;
      margin: 0 auto; display: block;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      border: 1px solid rgba(198,161,91,.45);
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 7vw, 3.4rem);
      margin: 0 auto;
      line-height: 1.08;
      max-width: 14ch;
    }
    .hero p {
      margin: 0 auto;
      max-width: 34ch;
      color: var(--mist);
      font-size: 1.02rem;
    }
    .cta {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="app">
    <section class="hero">
      <img class="logo" src="icon.png" alt="Astrologie &amp; Horoscope">
      <h1>Astrologie &amp; Horoscope</h1>
      <p>Choisir Astrologie ou Horoscope</p>
      <div class="cta tabs">
        <a href="portrait.html">Astrologie</a>
        <a href="horoscope.html" class="ghost">Horoscope</a>
      </div>
    </section>
  </div>
</body>
</html>
