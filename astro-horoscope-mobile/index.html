<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Astrologie &amp; Horoscope</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#0a1630">
  <link rel="stylesheet" href="css/wine-clone.css?v=140">
</head>
<body>
  <!-- Écran Wine 640×480 : Choisir Astrologie ou Horoscope -->
  <div id="fitChoix" class="fit">
    <div id="stageChoix" class="stage screen-choix">
      <img class="bg" src="res/wine_choix.png" alt="Astrologie &amp; Horoscope">

      <select id="profileList" class="hot spot-list" size="8" aria-label="Choix d'un profil"></select>

      <button type="button" class="hot spot-add" id="btnAdd" title="Ajouter" aria-label="Ajouter"></button>
      <button type="button" class="hot spot-edit" id="btnEdit" title="Modifier" aria-label="Modifier"></button>
      <button type="button" class="hot spot-del" id="btnDel" title="Supprimer" aria-label="Supprimer"></button>

      <button type="button" class="hot spot-horo" id="btnHoro" title="HOROSCOPE" aria-label="Horoscope"></button>
      <button type="button" class="hot spot-astro" id="btnAstro" title="ASTROLOGIE" aria-label="Astrologie"></button>
      <button type="button" class="hot spot-quit" id="btnQuit" title="Quitter" aria-label="Quitter"></button>
    </div>
  </div>

  <!-- Écran Wine 800×600 : ASTROLOGIE (roue + boutons DFM) -->
  <div id="fitAstro" class="fit hidden">
    <div id="stageAstro" class="stage screen-astro">
      <img class="bg" src="res/wine_astro_main.png" alt="ASTROLOGIE">

      <button type="button" class="hot a-cours" id="aCours" title="COURS" aria-label="Cours"></button>
      <button type="button" class="hot a-aide" id="aAide" title="AIDE" aria-label="Aide"></button>
      <button type="button" class="hot a-accueil" id="aAccueil" title="ACCUEIL" aria-label="Accueil"></button>
      <button type="button" class="hot a-portrait" id="aPortrait" title="PORTRAIT" aria-label="Portrait"></button>
      <button type="button" class="hot a-previsions" id="aPrevisions" title="PRÉVISIONS" aria-label="Prévisions"></button>
      <button type="button" class="hot a-cartes" id="aCartes" title="CARTES" aria-label="Cartes"></button>
      <button type="button" class="hot a-graphiques" id="aGraphiques" title="GRAPHIQUES" aria-label="Graphiques"></button>
      <button type="button" class="hot a-calculs" id="aCalculs" title="CALCULS" aria-label="Calculs"></button>
      <button type="button" class="hot a-reglages" id="aReglages" title="RÉGLAGES" aria-label="Réglages"></button>
      <button type="button" class="hot a-couples" id="aCouples" title="ASTRO-COUPLES" aria-label="Astro couples"></button>
      <button type="button" class="hot a-quitter" id="aQuitter" title="Quitter" aria-label="Retour choix"></button>
    </div>
  </div>

  <!-- Panneau module (sous-écrans : thème, textes, etc.) -->
  <div id="module" class="hidden" aria-live="polite">
    <header class="mod-bar">
      <button type="button" id="btnBack">◀ ASTROLOGIE</button>
      <strong id="modTitle">Module</strong>
      <button type="button" id="btnPrint">Imprimer</button>
    </header>
    <div id="modBody"></div>
  </div>

  <script src="js/delphi-calc.js?v=140"></script>
  <script src="js/atlas-lieu.js?v=140"></script>
  <script src="js/wine-app.js?v=140"></script>
</body>
</html>
