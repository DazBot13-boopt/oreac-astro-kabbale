<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Astrologie</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="stylesheet" href="css/desktop.css">
</head>
<body>
  <div id="stage-wrap">
    <div id="stage">
      <div id="fond" aria-hidden="true"></div>
      <div id="viewport" class="blank" aria-live="polite"></div>

      <button class="btn" id="btn-cours" data-view="cours" title="Cours">
        <img src="res/cours_off.png" data-off="res/cours_off.png" data-over="res/cours_over.png" alt="Cours">
      </button>
      <button class="btn" id="btn-fermer" data-view="fermer" title="Fermer">
        <img src="res/fermer_off.png" data-off="res/fermer_off.png" data-over="res/fermer_over.png" alt="Fermer">
      </button>
      <button class="btn" id="btn-accueil" data-view="accueil" title="Accueil">
        <img src="res/accueil_off.png" data-off="res/accueil_off.png" data-over="res/accueil_over.png" alt="Accueil">
      </button>
      <button class="btn" id="btn-cartes" data-view="cartes" title="Cartes">
        <img src="res/cartes_off.png" data-off="res/cartes_off.png" data-over="res/cartes_over.png" alt="Cartes">
      </button>
      <button class="btn" id="btn-theme" data-view="theme" title="Thème">
        <img src="res/theme_off.png" data-off="res/theme_off.png" data-over="res/theme_over.png" alt="Thème">
      </button>
      <button class="btn" id="btn-portrait" data-view="portrait" title="Portrait">
        <img src="res/portrait_off.png" data-off="res/portrait_off.png" data-over="res/portrait_over.png" alt="Portrait">
      </button>
      <button class="btn" id="btn-previsions" data-view="previsions" title="Prévisions">
        <img src="res/previsions_off.png" data-off="res/previsions_off.png" data-over="res/previsions_over.png" alt="Prévisions">
      </button>
      <button class="btn" id="btn-calculs" data-view="calculs" title="Calculs">
        <img src="res/calculs_off.png" data-off="res/calculs_off.png" data-over="res/calculs_over.png" alt="Calculs">
      </button>
      <button class="btn" id="btn-astro-couples" data-view="couples" title="Astro couples">
        <img src="res/astro_couples_off.png" data-off="res/astro_couples_off.png" data-over="res/astro_couples_over.png" alt="Astro couples">
      </button>
      <button class="btn" id="btn-graphiques" data-view="graphiques" title="Graphiques">
        <img src="res/graphiques_off.png" data-off="res/graphiques_off.png" data-over="res/graphiques_over.png" alt="Graphiques">
      </button>
      <button class="btn" id="btn-reglages" data-view="reglages" title="Réglages">
        <img src="res/reglages_off.png" data-off="res/reglages_off.png" data-over="res/reglages_over.png" alt="Réglages">
      </button>
      <button class="btn" id="btn-aide" data-view="aide" title="Aide">
        <img src="res/aide_off.png" data-off="res/aide_off.png" data-over="res/aide_over.png" alt="Aide">
      </button>
      <button class="btn" id="btn-sommaire" data-view="sommaire" title="Sommaire">
        <img src="res/sommaire_off.png" data-off="res/sommaire_off.png" data-over="res/sommaire_over.png" alt="Sommaire">
      </button>
      <button class="btn" id="btn-quitter" data-view="quitter" title="Quitter">
        <img src="res/quitter_off.png" data-off="res/quitter_off.png" data-over="res/quitter_over.png" alt="Quitter">
      </button>
      <button class="btn" id="btn-imprimer" data-view="imprimer" title="Imprimer">
        <img src="res/imprimer_off.png" data-off="res/imprimer_off.png" data-over="res/imprimer_over.png" alt="Imprimer">
      </button>
      <button class="btn" id="btn-enregistrer" data-view="enregistrer" title="Enregistrer">
        <img src="res/enregistrer_off.png" data-off="res/enregistrer_off.png" data-over="res/enregistrer_over.png" alt="Enregistrer">
      </button>
      <button class="btn" id="btn-envoyer" data-view="envoyer" title="Envoyer">
        <img src="res/envoyer_off.png" data-off="res/envoyer_off.png" data-over="res/envoyer_over.png" alt="Envoyer">
      </button>

      <div class="hint-bar" id="hint">Astrologie — interface desktop (Bernard Villemin)</div>
    </div>
  </div>
  <script src="js/delphi-calc.js"></script>
  <script src="js/desktop.js"></script>
</body>
</html>
