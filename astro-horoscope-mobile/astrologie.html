<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Astrologie — thème natal</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#1a2230">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/astronomy.browser.min.js"></script>
<script src="js/theme-store.js"></script>
<script src="js/astro-calc.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Accueil</a>
  <header class="brand">
    <div class="mark">Astrologie</div>
    <h1>Thème natal</h1>
    <p>Une saisie pour le portrait et l’horoscope du signe solaire.</p>
  </header>

  <section class="panel">
    <label for="nom">Nom</label>
    <input id="nom" placeholder="Ex. Lydie">
    <label for="ville">Ville</label>
    <input id="ville" placeholder="Ex. Cotonou" value="Cotonou">
    <div class="row-2">
      <div>
        <label for="lat">Latitude</label>
        <input id="lat" type="number" step="0.0001" value="6.3703">
      </div>
      <div>
        <label for="lon">Longitude</label>
        <input id="lon" type="number" step="0.0001" value="2.3912">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="annee">Année</label>
        <select id="annee"></select>
      </div>
      <div>
        <label for="mois">Mois</label>
        <select id="mois"></select>
      </div>
      <div>
        <label for="jour">Jour</label>
        <select id="jour"></select>
      </div>
    </div>
    <div class="row-2">
      <div>
        <label for="heure">Heure</label>
        <select id="heure"></select>
      </div>
      <div>
        <label for="minute">Minute</label>
        <select id="minute"></select>
      </div>
    </div>
    <label for="tz">Fuseau (UTC)</label>
    <select id="tz">
      <option value="0">UTC+0</option>
      <option value="1" selected>UTC+1 (Bénin / Afrique de l’Ouest)</option>
      <option value="2">UTC+2</option>
    </select>
    <p class="hint">Par défaut : Cotonou (Bénin). Modifiez lat/lon si besoin.</p>
    <button class="btn" type="button" id="btnCalc">Calculer le ciel</button>
  </section>

  <section class="panel" id="result" hidden>
    <div class="meta" id="meta"></div>
    <button class="btn btn-alt" type="button" onclick="location.href='portrait.html'">Ouvrir le portrait</button>
    <button class="btn btn-ghost" type="button" onclick="location.href='horoscope.html'">Horoscope du signe solaire</button>
  </section>
</div>
<script>
(function () {
  const annee = document.getElementById("annee");
  const mois = document.getElementById("mois");
  const jour = document.getElementById("jour");
  const heure = document.getElementById("heure");
  const minute = document.getElementById("minute");
  for (let y = 2035; y >= 1930; y--) {
    const o = document.createElement("option"); o.value = y; o.textContent = y; annee.appendChild(o);
  }
  annee.value = "1992";
  for (let m = 1; m <= 12; m++) {
    const o = document.createElement("option"); o.value = m; o.textContent = m; mois.appendChild(o);
  }
  mois.value = "10";
  for (let j = 1; j <= 31; j++) {
    const o = document.createElement("option"); o.value = j; o.textContent = j; jour.appendChild(o);
  }
  jour.value = "24";
  for (let h = 0; h <= 23; h++) {
    const o = document.createElement("option"); o.value = h; o.textContent = h + " h"; heure.appendChild(o);
  }
  heure.value = "12";
  for (let m = 0; m <= 59; m++) {
    const o = document.createElement("option"); o.value = m; o.textContent = m + " min"; minute.appendChild(o);
  }
  minute.value = "40";

  const saved = AstroTheme.load();
  if (saved) {
    if (saved.nom) document.getElementById("nom").value = saved.nom;
    if (saved.ville) document.getElementById("ville").value = saved.ville;
    if (saved.lat != null) document.getElementById("lat").value = saved.lat;
    if (saved.lon != null) document.getElementById("lon").value = saved.lon;
    if (saved.annee) annee.value = String(saved.annee);
    if (saved.mois) mois.value = String(saved.mois);
    if (saved.jour) jour.value = String(saved.jour);
    if (saved.heureStr) {
      const p = saved.heureStr.split(":");
      heure.value = String(+p[0]); minute.value = String(+p[1]);
    }
    if (saved.tzOff != null) document.getElementById("tz").value = String(saved.tzOff);
    showResult(saved);
  }

  document.getElementById("btnCalc").addEventListener("click", function () {
    const dossier = AstroCalc.calculerTheme({
      nom: document.getElementById("nom").value.trim() || "Client",
      ville: document.getElementById("ville").value.trim() || "Cotonou",
      villeLabel: document.getElementById("ville").value.trim() || "Cotonou",
      lat: +document.getElementById("lat").value,
      lon: +document.getElementById("lon").value,
      tzOff: +document.getElementById("tz").value,
      annee: +annee.value,
      mois: +mois.value,
      jour: +jour.value,
      heure: +heure.value,
      minute: +minute.value
    });
    showResult(dossier);
  });

  function showResult(d) {
    const box = document.getElementById("result");
    box.hidden = false;
    document.getElementById("meta").innerHTML =
      "<strong>" + d.nom + "</strong><br>" +
      d.villeLabel + " · " + d.jour + "/" + d.mois + "/" + d.annee + " " + d.heureStr +
      "<br>Soleil en <strong>" + d.signeNom + "</strong>";
  }
})();
</script>
</body>
</html>
