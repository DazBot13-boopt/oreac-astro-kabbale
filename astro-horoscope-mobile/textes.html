<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bibliothèque classique</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#1a2230">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme-store.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Accueil</a>
  <header class="brand">
    <div class="mark">Bibliothèque</div>
    <h1>Textes classiques</h1>
    <p>Planètes, signes et maisons de l’ancien logiciel</p>
  </header>
  <section class="panel">
    <div class="row-2">
      <div>
        <label for="cat">Catégorie</label>
        <select id="cat">
          <option value="planetes">Planètes</option>
          <option value="signes">Signes</option>
          <option value="extra">Extra</option>
        </select>
      </div>
      <div>
        <label for="item">Texte</label>
        <select id="item"></select>
      </div>
    </div>
  </section>
  <article class="panel" id="view"><p class="hint">Chargement…</p></article>
</div>
<script>
(async function () {
  let data;
  try { data = await fetch("data/classique-textes.json").then(r => r.json()); }
  catch (e) {
    document.getElementById("view").innerHTML = '<p class="warn">Corpus introuvable.</p>';
    return;
  }
  const cat = document.getElementById("cat");
  const item = document.getElementById("item");
  const view = document.getElementById("view");
  const d = AstroTheme.load();

  function fill() {
    const bag = data[cat.value] || {};
    item.innerHTML = "";
    Object.keys(bag).forEach(function (k) {
      const o = document.createElement("option");
      o.value = k; o.textContent = k; item.appendChild(o);
    });
    if (cat.value === "signes" && d && d.signeNom && bag[d.signeNom]) item.value = d.signeNom;
    show();
  }
  function show() {
    const bag = data[cat.value] || {};
    view.innerHTML = "<h2>" + item.value + '</h2><div class="article"></div>';
    view.querySelector(".article").textContent = bag[item.value] || "";
  }
  cat.addEventListener("change", fill);
  item.addEventListener("change", show);
  fill();
})();
</script>
</body>
</html>
