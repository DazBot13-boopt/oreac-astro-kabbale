<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horoscope — OREAC classique</title>
<link rel="icon" type="image/png" href="../favicon.png">
<meta name="theme-color" content="#3a5a40">
<script src="../js/theme-store.js"></script>
<style>
:root{
  --bark:#1f2a22;--moss:#3a5a40;--sand:#f3efe6;--paper:#faf7f0;
  --river:#2a6f97;--ink:#243028;--muted:#6b756e;
  --line:rgba(36,48,40,.12);--radius:14px;--shadow:0 10px 30px rgba(31,42,34,.12);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(165deg,#dfe8df 0%,var(--sand) 45%,#e8e0d2 100%);
  padding:clamp(12px,3vw,28px);
}
.wrap{max-width:820px;margin:0 auto}
.back{display:inline-block;margin-bottom:10px;color:var(--river);font-weight:600;text-decoration:none;font-size:.9rem}
h1{font-family:Georgia,serif;font-size:clamp(1.35rem,4vw,1.8rem);margin:0 0 6px;color:var(--bark)}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px;line-height:1.45}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{
  font:inherit;cursor:pointer;padding:8px 14px;border-radius:999px;
  border:1px solid rgba(58,90,64,.25);background:rgba(250,247,240,.85);color:var(--moss);font-weight:600;font-size:.85rem;
}
.tabs button.active{background:var(--moss);color:#faf7f0;border-color:transparent}
.panel{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:clamp(14px,3vw,22px);box-shadow:var(--shadow);min-height:200px;
}
.panel h2{font-family:Georgia,serif;margin:0 0 12px;font-size:1.1rem;color:var(--bark)}
.article{white-space:pre-wrap;line-height:1.55;font-size:.95rem}
.warn{color:#a63d2f}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Menus classiques</a>
  <h1 id="title">Horoscope</h1>
  <p class="sub" id="sub">Chargement…</p>
  <div class="tabs" id="tabs"></div>
  <article class="panel" id="view"></article>
</div>
<script>
const LABELS = {
  Signe: "Profil du signe",
  HoroscopeJour: "Horoscope du jour",
  TendanceMois: "Tendance du mois"
};
const ORDER = ["Signe", "HoroscopeJour", "TendanceMois"];

(async function () {
  const view = document.getElementById("view");
  const d = window.OreacTheme && OreacTheme.requireOrAlert();
  if (!d) {
    view.innerHTML = '<p class="warn">Calculez d’abord le thème sur l’écran principal.</p>';
    return;
  }
  const folder = d.signeFolder;
  const label = d.signeNom || "Signe";
  document.getElementById("title").textContent = "Horoscope — " + label;
  document.getElementById("sub").textContent =
    (d.nom || "Client") + " · " + d.jour + "/" + d.mois + "/" + d.annee +
    " · Soleil en " + label;

  let pack;
  try {
    const res = await fetch("../data/classique-horoscope.json");
    pack = await res.json();
  } catch (e) {
    view.innerHTML = '<p class="warn">Corpus horoscope introuvable.</p>';
    return;
  }
  const texts = (pack.signs && pack.signs[folder] && pack.signs[folder].texts) || {};
  const keys = ORDER.filter(function (k) { return texts[k]; });
  if (!keys.length) {
    view.innerHTML = '<p class="warn">Pas de textes pour ce signe.</p>';
    return;
  }
  const tabs = document.getElementById("tabs");
  let current = keys[0];
  keys.forEach(function (k) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = LABELS[k] || k;
    b.dataset.key = k;
    b.addEventListener("click", function () { show(k); });
    tabs.appendChild(b);
  });
  function show(k) {
    current = k;
    tabs.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.key === k);
    });
    view.innerHTML = "<h2>" + (LABELS[k] || k) + '</h2><div class="article"></div>';
    view.querySelector(".article").textContent = texts[k] || "";
  }
  show(current);
})();
</script>
</body>
</html>
