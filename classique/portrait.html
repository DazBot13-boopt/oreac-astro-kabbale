<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portrait astral classique — OREAC</title>
<link rel="icon" type="image/png" href="../favicon.png">
<meta name="theme-color" content="#3a5a40">
<style>
:root{
  --bark:#1f2a22;--moss:#3a5a40;--sand:#f3efe6;--paper:#faf7f0;
  --river:#2a6f97;--ink:#243028;--muted:#6b756e;
  --line:rgba(36,48,40,.12);--radius:14px;--shadow:0 10px 30px rgba(31,42,34,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(1000px 500px at 8% -8%,rgba(82,121,111,.16),transparent 55%),
    linear-gradient(165deg,#dfe8df 0%,var(--sand) 45%,#e8e0d2 100%);
  padding:clamp(12px,3vw,28px);
}
.wrap{max-width:900px;margin:0 auto}
.back{display:inline-block;margin-bottom:10px;color:var(--river);font-weight:600;text-decoration:none;font-size:.9rem}
h1{font-family:Georgia,serif;font-size:clamp(1.35rem,4vw,1.85rem);margin:0 0 4px;color:var(--bark)}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.layout{
  display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:14px;align-items:start;
}
@media (max-width:720px){
  .layout{grid-template-columns:1fr}
}
.sommaire{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;box-shadow:var(--shadow);position:sticky;top:12px;
}
.sommaire h2{font-family:Georgia,serif;font-size:1rem;margin:0 0 8px;color:var(--bark)}
.sommaire button{
  display:block;width:100%;text-align:left;font:inherit;cursor:pointer;
  padding:8px 10px;margin:0 0 4px;border:none;border-radius:8px;
  background:transparent;color:var(--ink);font-size:.86rem;
}
.sommaire button:hover,.sommaire button.active{background:rgba(58,90,64,.12);color:var(--moss);font-weight:600}
.reader{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:clamp(14px,3vw,22px);box-shadow:var(--shadow);min-height:280px;
}
.legacy-html{
  font-family:Georgia,"Times New Roman",serif;line-height:1.5;font-size:.95rem;
}
.legacy-html h2,.legacy-html h3{color:var(--bark);font-size:1.1rem}
.legacy-html u{text-decoration-color:var(--moss)}
.err{color:#a63d2f}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Module classique</a>
  <h1 id="title">Portrait astral</h1>
  <p class="sub">Sommaire → saute à la section. Exemple exporté de l’ancien logiciel.</p>
  <div class="layout">
    <nav class="sommaire" id="sommaire" aria-label="Sommaire"><h2>Sommaire</h2></nav>
    <article class="reader" id="reader"><p class="sub">Chargement…</p></article>
  </div>
</div>
<script>
let sections = [];

async function load() {
  const reader = document.getElementById("reader");
  try {
    const res = await fetch("../data/classique-portrait.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    document.getElementById("title").textContent = data.title || "Portrait astral";
    sections = data.sections || [];
  } catch (e) {
    reader.innerHTML = '<p class="err">Impossible de charger le portrait.</p>';
    return;
  }
  const nav = document.getElementById("sommaire");
  sections.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = (i + 1) + ". " + (s.label || "Section " + i);
    b.addEventListener("click", () => show(i));
    nav.appendChild(b);
  });
  if (sections.length) show(0);
}

function show(i) {
  const s = sections[i];
  document.querySelectorAll(".sommaire button").forEach((b, j) => {
    b.classList.toggle("active", j === i);
  });
  const reader = document.getElementById("reader");
  reader.innerHTML = '<div class="legacy-html"></div>';
  const box = reader.querySelector(".legacy-html");
  if (s.html) {
    box.innerHTML = s.html;
  } else {
    box.textContent = s.text || "";
  }
  reader.scrollIntoView({ behavior: "smooth", block: "start" });
}

load();
</script>
</body>
</html>
